name: Update FWI Forecast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Download and process FWI
        run: |
          python scripts/update_fwi.py

      - name: Check generated files
        run: |
          echo "Generated files:"
          find data/fwi -maxdepth 1 -type f -print

      - name: Commit FWI data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fwi

          if git diff --cached --quiet; then
            echo "No new FWI data to commit."
          else
            git commit -m "Update FWI forecast data"
            git push
          fi
