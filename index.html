<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه پیش‌بینی خطر حریق فارس</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #eef1f4;
            color: #222;
            font-family:
                "B Nazanin",
                "BNazanin",
                Tahoma,
                Arial,
                sans-serif;
        }

        header {
            background: #e85d04;
            color: #fff;
            text-align: center;
            padding: 16px 10px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            width: 100%;
            max-width: 1350px;
            margin: 18px auto;
            padding: 0 12px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .title {
            text-align: center;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* =========================
           راهنما
           ========================= */

        .legend-panel {
            margin-bottom: 12px;
            padding: 10px 12px;
            background: #f7f7f7;
            border-radius: 10px;
        }

        .panel-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .legend-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fff;
            padding: 6px 10px;
            border-radius: 7px;
            font-size: 17px;
        }

        .color {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            display: inline-block;
        }

        .low {
            background: #2ecc71;
        }

        .moderate {
            background: #f1c40f;
        }

        .high {
            background: #f39c12;
        }

        .very-high {
            background: #e67e22;
        }

        .extreme {
            background: #e74c3c;
        }

        .very-extreme {
            background: #8e44ad;
        }

        /* =========================
           نقشه + فیلتر
           ========================= */

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 235px;
            gap: 12px;
            align-items: stretch;
        }

        #map {
            width: 100%;
            height: 650px;
            border-radius: 10px;
            overflow: hidden;
        }

        .filters-panel {
            background: #f7f7f7;
            border-radius: 10px;
            padding: 14px;
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 14px 0;
            font-size: 18px;
            cursor: pointer;
        }

        .filter-item input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        #status {
            margin-top: 10px;
            text-align: center;
            font-size: 16px;
            color: #666;
        }

        /* =========================
           پاپ‌آپ
           ========================= */

        .popup-box {
            min-width: 220px;
            font-family:
                "B Nazanin",
                "BNazanin",
                Tahoma,
                Arial,
                sans-serif;
        }

        .popup-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .popup-row {
            margin: 5px 0;
            font-size: 17px;
        }

        .popup-label {
            font-weight: bold;
        }

        .risk-value {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 10px;
            border-radius: 7px;
            background: #f1f1f1;
            font-weight: bold;
        }

        @media (max-width: 850px) {

            header h1 {
                font-size: 21px;
            }

            .title {
                font-size: 20px;
            }

            .main-layout {
                grid-template-columns: 1fr;
            }

            #map {
                height: 520px;
            }

            .filters-panel {
                order: 2;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>
        سامانه پیش‌بینی خطر حریق در عرصه‌های طبیعی استان فارس
    </h1>
</header>

<div class="container">

    <div class="card">

        <div class="title">
            پیش‌بینی خطر حریق برای فردا
        </div>

        <!-- راهنما -->

        <div class="legend-panel">

            <div class="panel-title">
                راهنمای سطوح خطر حریق
            </div>

            <div class="legend-items">

                <div class="legend-item">
                    <span class="color low"></span>
                    کم
                </div>

                <div class="legend-item">
                    <span class="color moderate"></span>
                    متوسط
                </div>

                <div class="legend-item">
                    <span class="color high"></span>
                    زیاد
                </div>

                <div class="legend-item">
                    <span class="color very-high"></span>
                    خیلی زیاد
                </div>

                <div class="legend-item">
                    <span class="color extreme"></span>
                    شدید
                </div>

                <div class="legend-item">
                    <span class="color very-extreme"></span>
                    بسیار شدید
                </div>

            </div>

        </div>

        <!-- نقشه + فیلترها -->

        <div class="main-layout">

            <div id="map"></div>

            <div class="filters-panel">

                <div class="panel-title">
                    فیلترهای مکانی
                </div>

                <label class="filter-item">
                    <input
                        type="checkbox"
                        id="huntingToggle"
                    >
                    <span>مناطق شکار ممنوع</span>
                </label>

                <label class="filter-item">
                    <input
                        type="checkbox"
                        id="protectedToggle"
                    >
                    <span>مناطق چهارگانه</span>
                </label>

            </div>

        </div>

        <div id="status">
            در حال بارگذاری...
        </div>

    </div>

</div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

    /* ========================================================
       نقشه
       ======================================================== */

    const map = L.map("map");

    map.setView(
        [29.6, 52.5],
        7
    );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 18,
            attribution: "&copy; OpenStreetMap"
        }
    ).addTo(map);


    /* ========================================================
       متغیر لایه‌ها
       ======================================================== */

    let huntingLayer = null;
    let protectedLayer = null;


    /* ========================================================
       استایل شکار ممنوع
       ======================================================== */

    function huntingStyle() {

        return {
            color: "#8e44ad",
            weight: 2,
            fillColor: "#9b59b6",
            fillOpacity: 0.20
        };
    }


    /* ========================================================
       استایل مناطق چهارگانه
       ======================================================== */

    function protectedStyle() {

        return {
            color: "#16a085",
            weight: 2,
            fillColor: "#1abc9c",
            fillOpacity: 0.20
        };
    }


    /* ========================================================
       تعیین سطح خطر بر اساس FWI
       ======================================================== */

    function getRiskClass(fwi) {

        if (fwi === null || fwi === undefined) {
            return {
                name: "نامشخص",
                color: "#999"
            };
        }

        if (fwi < 11.2) {
            return {
                name: "کم",
                color: "#2ecc71"
            };
        }

        if (fwi < 21.3) {
            return {
                name: "متوسط",
                color: "#f1c40f"
            };
        }

        if (fwi < 38) {
            return {
                name: "زیاد",
                color: "#f39c12"
            };
        }

        if (fwi < 50) {
            return {
                name: "خیلی زیاد",
                color: "#e67e22"
            };
        }

        if (fwi <= 70) {
            return {
                name: "شدید",
                color: "#e74c3c"
            };
        }

        return {
            name: "بسیار شدید",
            color: "#8e44ad"
        };
    }


    /* ========================================================
       پاپ‌آپ منطقه
       ======================================================== */

    function createPopup(
        feature,
        regionType
    ) {

        const properties =
            feature.properties || {};

        /*
         * نام منطقه:
         * چند نام متداول را بررسی می‌کنیم تا
         * لازم نباشد ساختار GeoJSON را تغییر بدهیم.
         */

        const regionName =
            properties.name ||
            properties.NAME ||
            properties.Name ||
            properties.title ||
            properties.Title ||
            properties.region ||
            properties.REGION ||
            "نام منطقه ثبت نشده";

        /*
         * چون PNG فعلی عدد FWI ندارد،
         * فعلاً مقدار FWI را null می‌گذاریم.
         */

        const fwiValue = null;

        const risk =
            getRiskClass(
                fwiValue
            );

        const popup = `
            <div class="popup-box">

                <div class="popup-title">
                    ${regionName}
                </div>

                <div class="popup-row">
                    <span class="popup-label">
                        نوع منطقه:
                    </span>
                    ${regionType}
                </div>

                <div class="popup-row">
                    <span class="popup-label">
                        سطح خطر حریق:
                    </span>

                    <span
                        class="risk-value"
                        style="color:${risk.color};"
                    >
                        ${risk.name}
                    </span>
                </div>

                <div class="popup-row">
                    <span class="popup-label">
                        درصد سطح در معرض خطر:
                    </span>
                    در انتظار داده عددی FWI
                </div>

            </div>
        `;

        return popup;
    }


    /* ========================================================
       بارگذاری مناطق شکار ممنوع
       ======================================================== */

    async function loadHunting() {

        const response =
            await fetch(
                "hunting_banned.geojson?v=" +
                Date.now()
            );

        if (!response.ok) {
            throw new Error(
                "فایل مناطق شکار ممنوع پیدا نشد."
            );
        }

        const data =
            await response.json();

        huntingLayer =
            L.geoJSON(
                data,
                {

                    style:
                        huntingStyle,

                    onEachFeature:
                        function(
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                createPopup(
                                    feature,
                                    "منطقه شکار ممنوع"
                                )
                            );
                        }
                }
            );
    }


    /* ========================================================
       بارگذاری مناطق چهارگانه
       ======================================================== */

    async function loadProtected() {

        const response =
            await fetch(
                "protected_areas.geojson?v=" +
                Date.now()
            );

        if (!response.ok) {
            throw new Error(
                "فایل مناطق چهارگانه پیدا نشد."
            );
        }

        const data =
            await response.json();

        protectedLayer =
            L.geoJSON(
                data,
                {

                    style:
                        protectedStyle,

                    onEachFeature:
                        function(
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                createPopup(
                                    feature,
                                    "منطقه چهارگانه"
                                )
                            );
                        }
                }
            );
    }


    /* ========================================================
       فیلتر شکار ممنوع
       ======================================================== */

    document
        .getElementById(
            "huntingToggle"
        )
        .addEventListener(
            "change",
            function() {

                if (!huntingLayer) {
                    return;
                }

                if (this.checked) {
                    huntingLayer.addTo(map);
                } else {
                    map.removeLayer(
                        huntingLayer
                    );
                }
            }
        );


    /* ========================================================
       فیلتر مناطق چهارگانه
       ======================================================== */

    document
        .getElementById(
            "protectedToggle"
        )
        .addEventListener(
            "change",
            function() {

                if (!protectedLayer) {
                    return;
                }

                if (this.checked) {
                    protectedLayer.addTo(map);
                } else {
                    map.removeLayer(
                        protectedLayer
                    );
                }
            }
        );


    /* ========================================================
       FWI
       ======================================================== */

    async function loadFWI() {

        const response =
            await fetch(
                "data/fwi/metadata.json?v=" +
                Date.now()
            );

        if (!response.ok) {
            throw new Error(
                "metadata.json پیدا نشد."
            );
        }

        const metadata =
            await response.json();

        const bbox =
            metadata.bbox;

        const bounds = [

            [
                bbox.south,
                bbox.west
            ],

            [
                bbox.north,
                bbox.east
            ]

        ];

        const imageUrl =
            "data/fwi/" +
            metadata.output +
            "?v=" +
            Date.now();

        L.imageOverlay(
            imageUrl,
            bounds,
            {
                opacity: 0.85
            }
        ).addTo(map);

        map.fitBounds(
            bounds,
            {
                padding: [
                    20,
                    20
                ]
            }
        );
    }


    /* ========================================================
       شروع
       ======================================================== */

    async function initializeMap() {

        try {

            await loadFWI();

            await Promise.all(
                [
                    loadHunting(),
                    loadProtected()
                ]
            );

            document
                .getElementById("status")
                .textContent =
                "نقشه و لایه‌های مکانی آماده هستند.";

        } catch (error) {

            console.error(error);

            document
                .getElementById("status")
                .textContent =
                error.message;
        }
    }


    initializeMap();

</script>

</body>
</html>
