<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه پیش‌بینی خطر حریق فارس</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #eef1f4;
            font-family: Tahoma, Arial, sans-serif;
            color: #222;
        }

        header {
            background: #e85d04;
            color: white;
            text-align: center;
            padding: 18px 10px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 12px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        #map {
            width: 100%;
            height: 650px;
            border-radius: 10px;
            overflow: hidden;
        }

        .panel {
            margin-top: 14px;
            padding: 14px;
            background: #f7f7f7;
            border-radius: 10px;
        }

        .panel-title {
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 10px 0;
            font-size: 14px;
            cursor: pointer;
        }

        .filter-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .legend-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 7px 10px;
            border-radius: 7px;
            font-size: 13px;
        }

        .color {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            display: inline-block;
        }

        .low {
            background: #2ecc71;
        }

        .moderate {
            background: #f1c40f;
        }

        .high {
            background: #f39c12;
        }

        .very-high {
            background: #e67e22;
        }

        .severe {
            background: #e74c3c;
        }

        .extreme {
            background: #8e44ad;
        }

        #status {
            margin-top: 10px;
            padding: 8px;
            text-align: center;
            font-size: 13px;
            color: #666;
        }

        @media (max-width: 700px) {
            header h1 {
                font-size: 18px;
            }

            #map {
                height: 500px;
            }

            .legend-items {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>
        سامانه پیش‌بینی خطر حریق در عرصه‌های طبیعی استان فارس
    </h1>
</header>

<div class="container">

    <div class="card">

        <div class="title">
            پیش‌بینی خطر حریق برای فردا
        </div>

        <div id="map"></div>

        <div class="panel">

            <div class="panel-title">
                فیلترهای مکانی
            </div>

            <label class="filter-item">
                <input
                    type="checkbox"
                    id="huntingToggle"
                >
                <span>مناطق شکار ممنوع</span>
            </label>

            <label class="filter-item">
                <input
                    type="checkbox"
                    id="protectedToggle"
                >
                <span>مناطق چهارگانه</span>
            </label>

        </div>

        <div class="panel">

            <div class="panel-title">
                راهنمای سطوح خطر حریق
            </div>

            <div class="legend-items">

                <div class="legend-item">
                    <span class="color low"></span>
                    کم
                </div>

                <div class="legend-item">
                    <span class="color moderate"></span>
                    متوسط
                </div>

                <div class="legend-item">
                    <span class="color high"></span>
                    زیاد
                </div>

                <div class="legend-item">
                    <span class="color very-high"></span>
                    خیلی زیاد
                </div>

                <div class="legend-item">
                    <span class="color severe"></span>
                    شدید
                </div>

                <div class="legend-item">
                    <span class="color extreme"></span>
                    بسیار شدید
                </div>

            </div>

        </div>

        <div id="status">
            در حال بارگذاری نقشه...
        </div>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // ========================================================
    // نقشه اصلی
    // ========================================================

    const map = L.map("map");

    map.setView(
        [29.6, 52.5],
        7
    );


    // ========================================================
    // نقشه پایه
    // ========================================================

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 18,
            attribution: "&copy; OpenStreetMap"
        }
    ).addTo(map);


    // ========================================================
    // لایه‌های مکانی
    // ========================================================

    let huntingLayer = null;
    let protectedLayer = null;


    function huntingStyle() {

        return {
            color: "#8e44ad",
            weight: 2,
            fillColor: "#9b59b6",
            fillOpacity: 0.20
        };
    }


    function protectedStyle() {

        return {
            color: "#16a085",
            weight: 2,
            fillColor: "#1abc9c",
            fillOpacity: 0.20
        };
    }


    async function loadHunting() {

        const response = await fetch(
            "hunting_banned.geojson?v=2"
        );

        if (!response.ok) {
            throw new Error(
                "فایل مناطق شکار ممنوع پیدا نشد."
            );
        }

        const data = await response.json();

        huntingLayer = L.geoJSON(
            data,
            {
                style: huntingStyle
            }
        );
    }


    async function loadProtected() {

        const response = await fetch(
            "protected_areas.geojson?v=2"
        );

        if (!response.ok) {
            throw new Error(
                "فایل مناطق چهارگانه پیدا نشد."
            );
        }

        const data = await response.json();

        protectedLayer = L.geoJSON(
            data,
            {
                style: protectedStyle
            }
        );
    }


    // ========================================================
    // فیلتر شکار ممنوع
    // ========================================================

    document
        .getElementById("huntingToggle")
        .addEventListener(
            "change",
            function () {

                if (!huntingLayer) {
                    return;
                }

                if (this.checked) {
                    huntingLayer.addTo(map);
                } else {
                    map.removeLayer(
                        huntingLayer
                    );
                }
            }
        );


    // ========================================================
    // فیلتر مناطق چهارگانه
    // ========================================================

    document
        .getElementById("protectedToggle")
        .addEventListener(
            "change",
            function () {

                if (!protectedLayer) {
                    return;
                }

                if (this.checked) {
                    protectedLayer.addTo(map);
                } else {
                    map.removeLayer(
                        protectedLayer
                    );
                }
            }
        );


    // ========================================================
    // بارگذاری FWI با BBOX واقعی
    // ========================================================

    async function loadFWI() {

        const metadataResponse = await fetch(
            "data/fwi/metadata.json?v=2"
        );

        if (!metadataResponse.ok) {
            throw new Error(
                "metadata.json پیدا نشد."
            );
        }

        const metadata =
            await metadataResponse.json();

        const bbox = metadata.bbox;

        const bounds = [
            [
                bbox.south,
                bbox.west
            ],
            [
                bbox.north,
                bbox.east
            ]
        ];

        const imageUrl =
            "data/fwi/" +
            metadata.output +
            "?v=2";

        const fwiLayer =
            L.imageOverlay(
                imageUrl,
                bounds,
                {
                    opacity: 0.85,
                    interactive: false
                }
            );

        fwiLayer.addTo(map);

        // نقشه را با محدوده واقعی FWI هماهنگ می‌کنیم
        map.fitBounds(
            bounds,
            {
                padding: [
                    20,
                    20
                ]
            }
        );

        return fwiLayer;
    }


    // ========================================================
    // شروع
    // ========================================================

    async function initializeMap() {

        try {

            await loadFWI();

            await Promise.all([
                loadHunting(),
                loadProtected()
            ]);

            document
                .getElementById("status")
                .textContent =
                "نقشه و لایه‌های مکانی آماده هستند.";

        } catch (error) {

            console.error(error);

            document
                .getElementById("status")
                .textContent =
                error.message;
        }
    }


    initializeMap();

</script>

</body>
</html>
