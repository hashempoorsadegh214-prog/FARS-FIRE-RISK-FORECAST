<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه پیش‌بینی خطر حریق فارس</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        /* =====================================================
           فونت اصلی
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family:
                "B Nazanin",
                "BNazanin",
                "B Nazanin Outline",
                Tahoma,
                Arial,
                sans-serif;
        }

        body {
            background: #eef1f4;
            color: #222;
        }

        /* =====================================================
           سربرگ
           ===================================================== */

        header {
            background: #e85d04;
            color: white;
            text-align: center;
            padding: 16px 10px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: bold;
        }

        /* =====================================================
           محفظه اصلی
           ===================================================== */

        .container {
            width: 100%;
            max-width: 1350px;
            margin: 18px auto;
            padding: 0 12px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 14px;
            box-shadow:
                0 2px 12px rgba(0, 0, 0, 0.08);
        }

        /* =====================================================
           عنوان
           ===================================================== */

        .title {
            text-align: center;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* =====================================================
           راهنما - بالای نقشه
           ===================================================== */

        .legend-panel {
            margin-bottom: 12px;
            padding: 10px 12px;
            background: #f7f7f7;
            border-radius: 10px;
        }

        .panel-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .legend-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 6px 10px;
            border-radius: 7px;
            font-size: 17px;
        }

        .color {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            display: inline-block;
        }

        .low {
            background: #2ecc71;
        }

        .moderate {
            background: #f1c40f;
        }

        .high {
            background: #f39c12;
        }

        .very-high {
            background: #e67e22;
        }

        .severe {
            background: #e74c3c;
        }

        .extreme {
            background: #8e44ad;
        }

        /* =====================================================
           بخش اصلی: نقشه + فیلترها
           ===================================================== */

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 235px;
            gap: 12px;
            align-items: stretch;
        }

        /* =====================================================
           نقشه
           ===================================================== */

        .map-panel {
            min-width: 0;
        }

        #map {
            width: 100%;
            height: 650px;
            border-radius: 10px;
            overflow: hidden;
        }

        /* =====================================================
           پنل فیلترهای مکانی کنار نقشه
           ===================================================== */

        .filters-panel {
            background: #f7f7f7;
            border-radius: 10px;
            padding: 14px;
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 14px 0;
            font-size: 18px;
            cursor: pointer;
            line-height: 1.5;
        }

        .filter-item input {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .filter-description {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #ddd;
            font-size: 15px;
            line-height: 1.8;
            color: #666;
        }

        /* =====================================================
           وضعیت
           ===================================================== */

        #status {
            margin-top: 10px;
            padding: 8px;
            text-align: center;
            font-size: 16px;
            color: #666;
        }

        /* =====================================================
           موبایل
           ===================================================== */

        @media (max-width: 850px) {

            header h1 {
                font-size: 21px;
            }

            .title {
                font-size: 20px;
            }

            .main-layout {
                grid-template-columns: 1fr;
            }

            .filters-panel {
                order: 2;
            }

            #map {
                height: 520px;
            }

            .legend-item {
                font-size: 16px;
            }
        }

    </style>
</head>

<body>

<header>
    <h1>
        سامانه پیش‌بینی خطر حریق در عرصه‌های طبیعی استان فارس
    </h1>
</header>

<div class="container">

    <div class="card">

        <div class="title">
            پیش‌بینی خطر حریق برای فردا
        </div>

        <!-- =================================================
             راهنمای رنگ‌ها
             ================================================= -->

        <div class="legend-panel">

            <div class="panel-title">
                راهنمای سطوح خطر حریق
            </div>

            <div class="legend-items">

                <div class="legend-item">
                    <span class="color low"></span>
                    کم
                </div>

                <div class="legend-item">
                    <span class="color moderate"></span>
                    متوسط
                </div>

                <div class="legend-item">
                    <span class="color high"></span>
                    زیاد
                </div>

                <div class="legend-item">
                    <span class="color very-high"></span>
                    خیلی زیاد
                </div>

                <div class="legend-item">
                    <span class="color severe"></span>
                    شدید
                </div>

                <div class="legend-item">
                    <span class="color extreme"></span>
                    بسیار شدید
                </div>

            </div>

        </div>

        <!-- =================================================
             نقشه + فیلترها
             ================================================= -->

        <div class="main-layout">

            <!-- نقشه -->

            <div class="map-panel">

                <div id="map"></div>

            </div>

            <!-- فیلترهای مکانی -->

            <div class="filters-panel">

                <div class="panel-title">
                    فیلترهای مکانی
                </div>

                <label class="filter-item">

                    <input
                        type="checkbox"
                        id="huntingToggle"
                    >

                    <span>
                        مناطق شکار ممنوع
                    </span>

                </label>

                <label class="filter-item">

                    <input
                        type="checkbox"
                        id="protectedToggle"
                    >

                    <span>
                        مناطق چهارگانه
                    </span>

                </label>

                <div class="filter-description">

                    برای نمایش هر لایه،
                    تیک مربوط به آن را فعال کنید.

                </div>

            </div>

        </div>

        <div id="status">
            در حال بارگذاری نقشه...
        </div>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // ========================================================
    // ساخت نقشه
    // ========================================================

    const map = L.map("map");

    map.setView(
        [29.6, 52.5],
        7
    );


    // ========================================================
    // نقشه پایه
    // ========================================================

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 18,
            attribution: "&copy; OpenStreetMap"
        }
    ).addTo(map);


    // ========================================================
    // متغیر لایه‌ها
    // ========================================================

    let huntingLayer = null;
    let protectedLayer = null;


    // ========================================================
    // استایل مناطق شکار ممنوع
    // ========================================================

    function huntingStyle() {

        return {
            color: "#8e44ad",
            weight: 2,
            fillColor: "#9b59b6",
            fillOpacity: 0.20
        };
    }


    // ========================================================
    // استایل مناطق چهارگانه
    // ========================================================

    function protectedStyle() {

        return {
            color: "#16a085",
            weight: 2,
            fillColor: "#1abc9c",
            fillOpacity: 0.20
        };
    }


    // ========================================================
    // بارگذاری FWI
    // ========================================================

    async function loadFWI() {

        const response = await fetch(
            "data/fwi/metadata.json?v=" + Date.now()
        );

        if (!response.ok) {

            throw new Error(
                "metadata.json پیدا نشد."
            );
        }

        const metadata =
            await response.json();

        const bbox =
            metadata.bbox;

        const bounds = [

            [
                bbox.south,
                bbox.west
            ],

            [
                bbox.north,
                bbox.east
            ]

        ];

        const imageUrl =
            "data/fwi/" +
            metadata.output +
            "?v=" +
            Date.now();

        const fwiLayer =
            L.imageOverlay(
                imageUrl,
                bounds,
                {
                    opacity: 0.85,
                    interactive: false
                }
            ).addTo(map);

        map.fitBounds(
            bounds,
            {
                padding: [
                    20,
                    20
                ]
            }
        );

        return fwiLayer;
    }


    // ========================================================
    // مناطق شکار ممنوع
    // ========================================================

    async function loadHunting() {

        const response =
            await fetch(
                "hunting_banned.geojson?v=" +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "hunting_banned.geojson پیدا نشد."
            );
        }

        const data =
            await response.json();

        huntingLayer =
            L.geoJSON(
                data,
                {
                    style:
                        huntingStyle
                }
            );
    }


    // ========================================================
    // مناطق چهارگانه
    // ========================================================

    async function loadProtected() {

        const response =
            await fetch(
                "protected_areas.geojson?v=" +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "protected_areas.geojson پیدا نشد."
            );
        }

        const data =
            await response.json();

        protectedLayer =
            L.geoJSON(
                data,
                {
                    style:
                        protectedStyle
                }
            );
    }


    // ========================================================
    // فیلتر شکار ممنوع
    // ========================================================

    document
        .getElementById(
            "huntingToggle"
        )
        .addEventListener(
            "change",
            function () {

                if (!huntingLayer) {
                    return;
                }

                if (this.checked) {

                    huntingLayer.addTo(
                        map
                    );

                } else {

                    map.removeLayer(
                        huntingLayer
                    );
                }
            }
        );


    // ========================================================
    // فیلتر مناطق چهارگانه
    // ========================================================

    document
        .getElementById(
            "protectedToggle"
        )
        .addEventListener(
            "change",
            function () {

                if (!protectedLayer) {
                    return;
                }

                if (this.checked) {

                    protectedLayer.addTo(
                        map
                    );

                } else {

                    map.removeLayer(
                        protectedLayer
                    );
                }
            }
        );


    // ========================================================
    // راه‌اندازی
    // ========================================================

    async function initializeMap() {

        try {

            await loadFWI();

            await Promise.all(
                [
                    loadHunting(),
                    loadProtected()
                ]
            );

            document
                .getElementById(
                    "status"
                )
                .textContent =
                "نقشه و لایه‌های مکانی آماده هستند.";

        } catch (error) {

            console.error(
                error
            );

            document
                .getElementById(
                    "status"
                )
                .textContent =
                error.message;
        }
    }


    initializeMap();

</script>

</body>
</html>
